name: C/C++ CI

on:
  workflow_dispatch:
  # push:
  #   branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      # Windows: MSVC (MSBuild)
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake-build.bat
        shell: cmd

      # Linux: GCC / macOS: Clang
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x cmake-build.sh
          ./cmake-build.sh
        shell: bash

      - name: List Dir (Unix)
        if: runner.os != 'Windows'
        run: find . -type f | sort

      - name: List Dir (Windows)
        if: runner.os == 'Windows'
        run: |
          (Get-ChildItem -Recurse -File).FullName | Sort-Object
        shell: pwsh

      # Upload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            ${{ 
              runner.os == 'Windows' && './build/Litematic_V7_To_V6_DynamicLibrary/x64/Release/Litematic_V7_To_V6_DynamicLibrary.dll' || 
              runner.os == 'Linux' && './build/Litematic_V7_To_V6_DynamicLibrary/Litematic_V7_To_V6_DynamicLibrary.so' || 
              runner.os == 'macOS' && './build/Litematic_V7_To_V6_DynamicLibrary/Litematic_V7_To_V6_DynamicLibrary.dylib'
            }}
          if-no-files-found: error
