name: C/C++ CI

on:
  workflow_dispatch:
  # push:
  #   branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup compiler environment
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            MSBUILD_PATH=$(vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild/Current/Bin/MSBuild.exe | head -1)
            if [ -n "$MSBUILD_PATH" ]; then
              MSBUILD_DIR=$(dirname "$MSBUILD_PATH")
            else
              exit 1
            fi
          fi
        shell: bash

      # Windows: MSVC (MSBuild)
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake-build.bat
        shell: cmd

      # Linux: GCC / macOS: Clang
      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x cmake-build.sh
          ./cmake-build.sh
        shell: bash

      # Upload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-artifacts
          path: |
            build/*.dll
            build/*.so
            build/*.dylib
          if-no-files-found: error
